<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>links</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #ffffff;
    --ink: #000000;
    --ink-soft: #000000;
    --line: rgba(0, 0, 0, 0.14);
    --line-h: rgba(0, 0, 0, 0.35);
    --box: #ffffff;
    --box-h: #f4f4f4;
    --matcha-wash: #ffffff;
    --stroke-ink: #000000;
    --ink-wash: #4f5753;
    --sweep: rgba(0, 0, 0, 0.06);
    --orb-a: #bccbbf;
    --orb-b: #c9d5ca;
    --orb-c: #adbfb2;
    --m1: 0.06;
    --m2: 0.10;
    --m3: 0.14;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--paper);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Times New Roman", Times, "Songti TC", "PMingLiU", serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  /* 水墨背景 */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .ink   { fill: var(--ink-wash); }
  .matcha { fill: var(--matcha-wash); }
  .m1 { opacity: var(--m1); }
  .m2 { opacity: var(--m2); }
  .m3 { opacity: var(--m3); }
  .stem { fill: none; stroke: var(--stroke-ink); stroke-width: 3; stroke-linecap: round; opacity: 0.11; }
  .leaf { fill: var(--stroke-ink); opacity: 0.08; }
  .p-blue { fill: var(--p-blue); }
  .p-sage { fill: var(--p-sage); }
  .p-deep { fill: var(--p-deep); }
  .p-pale { fill: var(--p-pale); }
  .petal { fill: none; stroke: var(--p-line); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .g1 { fill: var(--green-mid); }
  .g2 { fill: var(--green-pale); }
  .gstem { fill: none; stroke: var(--green-mid); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
  .gleaf { fill: var(--green-mid); opacity: 0.4; }
  .grain { opacity: var(--grain-opacity); mix-blend-mode: multiply; }

  /* 水墨遠山 */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .ink { fill: var(--ink-wash); }
  .m1 { opacity: var(--m1); }
  .m2 { opacity: var(--m2); }
  .m3 { opacity: var(--m3); }

  /* 版面 */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 380px;
  }

  @keyframes settle {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .header { text-align: center; margin-bottom: 32px; }

  .avatar {
    width: 68px;
    height: 68px;
    margin: 0 auto 18px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: radial-gradient(circle at 35% 30%, var(--matcha-wash), transparent 80%), var(--box);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }

  h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.16em;
    padding-left: 0.16em;
  }

  .tagline {
    margin: 10px 0 0;
    font-size: 15px;
    font-style: italic;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    padding: 0 16px 0 calc(16px + 0.1em);
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--box);
    color: var(--ink);
    text-decoration: none;
    font-size: 17px;
    line-height: 1;
    letter-spacing: 0.1em;
    transition: transform 0.25s ease, border-color 0.3s ease;
  }
  .link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--sweep);
    transform: translateX(-101%);
    transition: transform 0.35s ease;
  }
  .link:hover, .link:focus-visible {
    border-color: var(--line-h);
    transform: translateX(4px);
  }
  .link:hover::before, .link:focus-visible::before { transform: translateX(0); }
  .link:active { transform: translateX(2px); }
  .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }


  /* 會動的部分 */
  .header { animation: settle 0.9s ease both; }

  .link {
    animation: settle 0.8s ease both;
    animation-delay: calc(0.3s + var(--i, 0) * 0.12s);
  }
  .link:nth-child(1) { --i: 0; }
  .link:nth-child(2) { --i: 1; }
  .link:nth-child(3) { --i: 2; }
  .link:nth-child(4) { --i: 3; }
  .link:nth-child(5) { --i: 4; }

  .leafsway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(5deg); }
  }

  .drift { animation: drift 22s ease-in-out infinite alternate; }
  .drift.slow { animation-duration: 32s; animation-direction: alternate-reverse; }
  @keyframes drift {
    from { transform: translateX(-90px); }
    to   { transform: translateX(90px); }
  }

  .bird path { fill: none; stroke: var(--ink-wash); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.42; }
  .bird { animation: fly 70s linear infinite; }
  .bird.b2 { animation-duration: 95s; animation-delay: -40s; }
  @keyframes fly {
    from { transform: translateX(-140px); }
    to   { transform: translateX(1580px); }
  }

  /* 綠灰色的圓 */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    --s: min(var(--m), 58vw);
    top: var(--y);
    width: var(--s);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%), var(--c, var(--orb-a));
    opacity: 0.5;
    animation: breathe var(--d) ease-in-out infinite alternate, orbfloat 9s ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s), var(--delay, 0s);
  }
  .orb.l { left: calc(var(--s) * -0.55); }
  .orb.r { left: calc(100vw - var(--s) * 0.45); }
  .orb.t { left: var(--x); top: calc(var(--s) * -0.55); }
  .orb.b { --c: var(--orb-b); }
  .orb.c { --c: var(--orb-c); }
  @keyframes breathe {
    from { scale: 0.82; }
    to   { scale: 1.18; }
  }
  @keyframes orbfloat {
    from { translate: 0 -8px; }
    to   { translate: 0 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .link, .leafsway, .drift, .bird, .orb { animation: none; }
    .link, .link::before { transition: none; }
  }
</style>
</head>
<body>

<svg class="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
  <defs>
    <filter id="bleed" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="4"/>
    </filter>
    <filter id="mist" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="10"/>
    </filter>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper);stop-opacity:0"/>
      <stop offset="0.5" style="stop-color:var(--paper);stop-opacity:0.9"/>
      <stop offset="1" style="stop-color:var(--paper);stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="cloud">
      <stop offset="0" style="stop-color:var(--paper);stop-opacity:0.9"/>
      <stop offset="1" style="stop-color:var(--paper);stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 遠山 -->
  <g filter="url(#mist)">
    <path class="ink m1" d="M0 620 C120 560 200 520 300 560 C380 590 440 480 540 470 C640 460 700 540 800 560 C900 580 960 500 1060 480 C1160 460 1260 540 1440 560 L1440 900 L0 900Z"/>
  </g>
  <rect y="520" width="1440" height="260" fill="url(#fog)"/>

  <!-- 中山 -->
  <g filter="url(#bleed)">
    <path class="ink m2" d="M0 700 C140 650 260 600 380 640 C500 680 560 620 680 610 C800 600 880 680 1000 670 C1120 660 1240 600 1440 650 L1440 900 L0 900Z"/>
  </g>
  <rect y="640" width="1440" height="200" fill="url(#fog)" opacity="0.7"/>

  <!-- 近山 -->
  <g filter="url(#bleed)">
    <path class="ink m3" d="M0 800 C160 760 300 740 460 770 C620 800 760 760 920 770 C1100 782 1260 750 1440 780 L1440 900 L0 900Z"/>
  </g>

  <!-- 飄移的雲霧 -->
  <g class="drift">
    <ellipse cx="420" cy="600" rx="430" ry="48" fill="url(#cloud)"/>
    <ellipse cx="1120" cy="660" rx="470" ry="52" fill="url(#cloud)"/>
  </g>
  <g class="drift slow">
    <ellipse cx="760" cy="720" rx="520" ry="46" fill="url(#cloud)"/>
    <ellipse cx="80" cy="690" rx="380" ry="44" fill="url(#cloud)"/>
  </g>

  <!-- 飛過的鳥 -->
  <g class="bird b1"><path d="M0 190 q9 -9 18 0 q9 -9 18 0"/></g>
  <g class="bird b2"><path d="M0 262 q7 -7 14 0 q7 -7 14 0"/></g>
</svg>

<div class="sky" aria-hidden="true">
  <div class="orb l"   style="--m:280px;--y:8%;--d:6s"></div>
  <div class="orb t b" style="--m:300px;--x:40vw;--d:7s;--delay:-2s"></div>
  <div class="orb r c" style="--m:360px;--y:14%;--d:8s;--delay:-3s"></div>
  <div class="orb l b" style="--m:380px;--y:44%;--d:7.5s;--delay:-1s"></div>
  <div class="orb r"   style="--m:420px;--y:56%;--d:6.5s;--delay:-4s"></div>
  <div class="orb l c" style="--m:260px;--y:78%;--d:5.5s;--delay:-2.5s"></div>
</div>

<main class="page">
  <div class="wrap">
    <header class="header">
      <!-- 換成照片時，把這個 svg 換成 <img src="..." alt=""> -->
      <div class="avatar">
        <svg viewBox="0 0 68 68" aria-hidden="true">
          <g class="leafsway" fill="none" stroke="var(--stroke-ink)" stroke-opacity="0.6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M34 60 C34 46 36 36 40 24"/>
            <path d="M35 47 C27 45 23 39 24 32 C32 34 37 40 35 47Z"/>
            <path d="M37 37 C45 35 49 29 48 22 C40 24 35 30 37 37Z"/>
          </g>
        </svg>
      </div>
      <h1>muran</h1>
    </header>

    <nav class="links" aria-label="Links">

    </nav>
  </div>
</main>

</body>
</html>
